[pytest]
log_cli = true
log_cli_level = INFO
;log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
;log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_format = %(message)s
log_cli_date_format=%m/%d/%Y %I:%M:%S%p

log_file = pytest.log
log_file_level = INFO
;log_file_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_file_format = %(message)s
log_file_date_format=%m/%d/%Y %I:%M:%S%p
testpaths = napari_buddy/_tests
markers =
    slow: needs internet (Zenodo sample data); skipped in the GitHub workflow with -m "not slow"
filterwarnings =
    ignore::DeprecationWarning:aicsimageio
    ignore::FutureWarning:bigfish
    ignore:.*json_encoders.*:DeprecationWarning
    ignore:.*is a low contrast image:UserWarning
    ignore:Feature 'in_cell' looks like categorical data:RuntimeWarning
