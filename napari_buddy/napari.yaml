name: napari-buddy
display_name: Napari Buddy
# use 'hidden' to remove plugin from napari hub search results
visibility: hidden
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
categories: ["Annotation", "Segmentation", "Acquisition"]
contributions:
  commands:
    - id: napari-buddy.get_reader
      python_name: napari_buddy._reader:napari_get_reader
      title: Open data with Napari BigFish
    - id: napari-buddy.config_widget
      python_name: napari_buddy._config_widget:config_widget
      title: Create config file
    - id: napari-buddy.reassign_buds_widget
      python_name: napari_buddy._bud_widget:reassign_buds_widget
      title: Reassign buds to mothers
    - id: napari-buddy.pipeline_widget
      python_name: napari_buddy._pipeline_widget:pipeline_widget
      title: buddy pipeline (panel only)
    - id: napari-buddy.pipeline_tabs
      python_name: napari_buddy._tabs:pipeline_tabs
      title: buddy pipeline
    - id: napari-buddy.spot_tuning_tabs
      python_name: napari_buddy._tabs:spot_tuning_tabs
      title: Spot tuning
    - id: napari-buddy.correct_tabs
      python_name: napari_buddy._tabs:correct_tabs
      title: Correct images
    - id: napari-buddy.layer_groups_widget
      python_name: napari_buddy._layer_groups:layer_groups_widget
      title: Layer groups
    - id: napari-buddy.correct_images_widget
      python_name: napari_buddy._review:correct_images_widget
      title: Correct images
    - id: napari-buddy.read_in_vsi_widget
      python_name: napari_buddy:read_in_vsi_widget
      title: Read in image
    - id: napari-buddy.make_background_filtering_magic_widget
      python_name: napari_buddy:background_filtering_magic_widget
      title: Make background filtering magic widget
    - id: napari-buddy.make_spot_detection_magic_widget
      python_name: napari_buddy:spot_detection_magic_widget
      title: Make spot detection magic widget
    - id: napari-buddy.spot_thresholding_magic_widget
      python_name: napari_buddy:spot_thresholding_magic_widget
      title: Make spot thresholding magic widget
    - id: napari-buddy.spot_decomposition_magic_widget
      python_name: napari_buddy:spot_decomposition_magic_widget
      title: Make spot decomposition magic widget
  readers:
    - command: napari-buddy.get_reader
      accepts_directories: false
      filename_patterns: ['*.json']
  widgets:
    - command: napari-buddy.pipeline_tabs
      display_name: buddy pipeline
    - command: napari-buddy.spot_tuning_tabs
      display_name: Spot tuning
    - command: napari-buddy.correct_tabs
      display_name: Correct images
