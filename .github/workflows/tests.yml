# napari-buddy's tests on every push and pull request, on Linux and Windows: the reader and the spot-tuning panels,
# on buddy's test field (release test-data-v2 of buddy), with buddy installed from GitHub. napari runs without a
# screen (headless-gui). The Zenodo sample-data test (needs internet, slow) is skipped: run it with `pytest -m slow`.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Qt libraries (Linux)
        uses: tlambert03/setup-qt-libs@v1
      - name: Install PyTorch (CPU build)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install buddy from GitHub (not on PyPI)
        # buddy is a private repository: the workflow's own token cannot read it, so a token with read access to
        # buddy is stored as the secret BUDDY_TOKEN (Settings -> Secrets and variables -> Actions). Without the
        # secret (e.g. once buddy is public) it installs without one.
        shell: bash
        env:
          BUDDY_TOKEN: ${{ secrets.BUDDY_TOKEN }}
        run: |
          if [ -n "$BUDDY_TOKEN" ]; then
            pip install "buddy @ git+https://x-access-token:${BUDDY_TOKEN}@github.com/Tutuccilab/buddy.git"
          else
            pip install "buddy @ git+https://github.com/Tutuccilab/buddy.git"
          fi
      - name: Install napari-buddy
        run: pip install -e ".[testing]"
      - name: Download buddy's test field
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUDDY_TOKEN || github.token }}
        run: |
          gh release download test-data-v2 --repo Tutuccilab/buddy --pattern field_A.zip --dir "$RUNNER_TEMP" --clobber
          mkdir -p napari_buddy/_tests/data
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall('napari_buddy/_tests/data')" "$RUNNER_TEMP/field_A.zip"
      - name: Tests (without a screen)
        uses: aganders3/headless-gui@v2
        env:
          NAPARI_BUDDY_REQUIRE_TEST_DATA: "1"
        with:
          run: pytest -m "not slow" -v --durations=10
